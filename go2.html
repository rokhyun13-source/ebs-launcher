<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>EBS 앱으로 재생</title>
<style>
  :root{--bg:#F7F8F3;--card:#fff;--ink:#1E3A4A;--muted:#5E6E78;--btn:#1E3A4A;--btn-ink:#fff;--line:#D7DEE2}
  @media (prefers-color-scheme:dark){:root{--bg:#141E27;--card:#1B2833;--ink:#E6EEF3;--muted:#9FB0BC;--btn:#E6EEF3;--btn-ink:#141E27;--line:#2E404D}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;max-width:460px;width:100%;
    display:flex;flex-direction:column;gap:16px;text-align:center}
  h1{font-size:24px;margin:0;line-height:1.35}
  p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
  a.play{display:block;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;font-size:22px;border-radius:16px;padding:20px 16px}
  a.web{color:var(--ink);font-size:15px}
  .err{color:#C0392B}
  code{font-size:12px;word-break:break-all;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <p>EBS 초등 앱</p>
  <h1 id="title">강의 준비 중…</h1>
  <a class="play" id="play" href="#">▶ EBS 앱에서 재생</a>
  <p id="help">앱이 바로 열리지 않으면 위 버튼을 눌러 주세요.<br>처음에는 EBS 초등 앱 설치와 로그인이 필요해요.</p>
  <a class="web" id="web" href="#">앱 대신 웹 학습창으로 보기</a>
  <code id="dbg" hidden></code>
</main>
<script>
(function(){
  /* 강의 정보: 주소 전체에서 찾는다. EBS 아이디(u)는 # 뒤에서만 읽는다(# 뒤는 서버로 전송되지 않음) */
  var raw=location.href, href=raw;
  for(var i=0;i<3;i++){ try{ var d=decodeURIComponent(href); if(d===href) break; href=d; }catch(e){ break; } }
  href=href.replace(/&amp;/g,"&");
  var hash=href.indexOf("#")>=0?href.slice(href.indexOf("#")):"";
  var c=(href.match(/[?&;#]c=(\d{6,12})/)||[])[1]||"";
  var l=(href.match(/LS\d{10,20}/)||[])[0]||"";
  var s=(href.match(/STEP\d{4,20}/)||[])[0]||"";
  var t=(href.match(/[?&;]t=([^&#]*)/)||[])[1]||"";
  var u=(hash.match(/[#&;]u=([A-Za-z0-9_.@\-]{2,40})/)||[])[1]||"";
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  var el=function(id){return document.getElementById(id)};
  if(!c||!l){
    el("title").textContent="강의 정보가 없어요"; el("title").className="err";
    el("play").style.display="none"; el("web").style.display="none";
    el("help").textContent="아래 주소를 그대로 알려 주시면 고칠게요.";
    el("dbg").hidden=false; el("dbg").textContent=raw.replace(/([#&;]u=)[^&#]*/,"$1***");
    return;
  }
  el("title").textContent=t.replace(/\+/g," ")||"EBS 강의";
  if(!u){ el("help").innerHTML="EBS 아이디가 없어 앱에서 재생이 안 될 수 있어요.<br>공부방 부모님 탭에서 EBS 아이디를 저장해 주세요."; }
  /* EBS 모바일 사이트가 EBS 초등 앱(kr.ebs.primary.player)에 넘기는 것과 같은 형식 */
  var app="intent://player?site-id=ebs&user-id=&info-url=http://primary.ebs.co.kr/frame/course/getPlayContentsV2"
    +"&data=format%3D1%26mode%3Dplay%26items%3Dplay%253B"+encodeURIComponent(encodeURIComponent(u))+"%253BPS%253B"+c+"%253B"+l
    +"&req-version=0#Intent;scheme=ebsprimary;package=kr.ebs.primary.player;end";
  el("play").href=app;
  el("web").href="https://primary.ebs.co.kr/pleasure/course/player/main/index?cid="+c+(s?"&sid="+s:"")+"&lid="+l+"&eno=1&encType=M10&indexPosition=";
  if(u) setTimeout(function(){ location.href=app; },300);
})();
</script>
</body>
</html>
